# Development: run everything from project root:
#   cd /var/www/html/messaging
#   docker compose -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: messaging-postgres
    environment:
      POSTGRES_DB: messaging_db
      POSTGRES_USER: messaging_user
      POSTGRES_PASSWORD: messaging_password
    # Host 5433 → container 5432 (use 5432:5432 only if local Postgres is not running)
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messaging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messaging_user -d messaging_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: messaging-redis
    # Host 6380 → container 6379 (use 6379:6379 only if local Redis is not running)
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - messaging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./messaging-backend
      dockerfile: Dockerfile.dev
    container_name: messaging-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://messaging_user:messaging_password@postgres:5432/messaging_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
    working_dir: /app
    # Code baked into image — rebuild with: docker compose -f docker-compose.dev.yml up --build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messaging-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  celery-worker:
    build:
      context: ./messaging-backend
      dockerfile: Dockerfile.dev
    container_name: messaging-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://messaging_user:messaging_password@postgres:5432/messaging_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-key-change-in-production
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - messaging-network
    restart: unless-stopped

  frontend:
    build:
      context: ./messaging-frontend
      dockerfile: Dockerfile.dev
    container_name: messaging-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    # Frontend code baked into image — rebuild after UI changes
    depends_on:
      backend:
        condition: service_started
    networks:
      - messaging-network

networks:
  messaging-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
