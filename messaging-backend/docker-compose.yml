version: "3.9"

services:
  api:
    build: .
    container_name: messaging_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    restart: always

  db:
    image: postgres:15
    container_name: messaging_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messaging_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: messaging_redis
    restart: always

  celery:
    build: .
    container_name: messaging_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      - redis
      - db
    env_file:
      - .env
    restart: always

volumes:
  postgres_data:
