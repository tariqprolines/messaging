version: "3.9"

services:
  api:
    build: .
    container_name: messaging_api
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

  db:
    image: postgres:15
    container_name: messaging_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messaging_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: messaging_redis
    ports:
      - "6379:6379"
    restart: always

  celery:
    build: .
    container_name: messaging_celery
    command: celery -A app.worker.celery_worker worker --loglevel=info
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data:
